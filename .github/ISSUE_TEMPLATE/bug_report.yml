name: Bug report
description: Report a reproducible Prime Continuim problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, OAuth URLs, private workspace paths, transcripts, or retained fixture contents. Report security issues through SECURITY.md.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS arm64
        - macOS Intel
        - Windows x64
        - Linux x64
        - Other
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The output of `git rev-parse --short HEAD` or the package version.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the visible result without private paths or provider data.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the shortest repeatable sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Path-free diagnostics
      description: Paste only diagnostics explicitly labeled safe to share.
      render: shell
