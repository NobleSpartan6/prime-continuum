name: Feature request
description: Propose a focused product or engineering improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user outcome is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the smallest complete interaction, including failure and recovery.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add references, measurements, or comparable product behavior when useful.
  - type: checkboxes
    id: boundary
    attributes:
      label: Release boundary
      options:
        - label: I have not presented a deferred remote, mobile, signing, or sandbox capability as already available.
          required: true
