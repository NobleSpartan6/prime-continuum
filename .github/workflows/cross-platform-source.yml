name: Cross-platform source gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-gates:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-24.04
            timeout_minutes: 20
          - label: Windows x64
            os: windows-2025
            timeout_minutes: 30
          - label: macOS arm64
            os: macos-15
            timeout_minutes: 20
    env:
      CI: "true"
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.9.0
          run_install: false

      - name: Install pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install the frozen dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prepare the verified Electron sandbox on Linux
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Typecheck Node, renderer, and relay boundaries
        run: pnpm typecheck

      - name: Run the complete root and relay source test suite
        run: pnpm test

      - name: Build the desktop, host-service, and relay source on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm build

      - name: Build the desktop, host-service, and relay source
        if: runner.os != 'Linux'
        run: pnpm build
