name: Cross-platform source gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-gates:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-24.04
          - label: Windows x64
            os: windows-2025
          - label: macOS arm64
            os: macos-15
    env:
      CI: "true"
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pinned pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.9.0
          run_install: false

      - name: Install pinned Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install the frozen dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck Node and renderer boundaries
        run: pnpm typecheck

      - name: Run the complete source test suite
        run: pnpm test

      - name: Build the desktop and host-service source
        run: pnpm build
